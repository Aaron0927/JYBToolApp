<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>JYBToolApp · 全应用交互原型</title>
  <style>
    :root {
      color-scheme: light dark;
      --canvas: #f4f5f7;
      --sidebar: #eceef1;
      --surface: #fff;
      --surface-muted: #f7f8fa;
      --line: #d9dde3;
      --text: #1e2329;
      --secondary: #626b76;
      --tertiary: #818a95;
      --accent: #146bd1;
      --accent-soft: #e8f1fc;
      --green: #23834b;
      --green-soft: #e8f5ed;
      --orange: #a65b00;
      --orange-soft: #fff3df;
      --red: #bd3434;
      --red-soft: #fbeaea;
      --shadow: 0 12px 36px #1118271a;
      font: 13px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --canvas: #17191c;
        --sidebar: #202327;
        --surface: #25292e;
        --surface-muted: #2b3036;
        --line: #3a4048;
        --text: #edf0f3;
        --secondary: #b0b8c2;
        --tertiary: #858e99;
        --accent: #6daeff;
        --accent-soft: #26384d;
        --green: #73d397;
        --green-soft: #22392b;
        --orange: #ffc16b;
        --orange-soft: #42331f;
        --red: #ff8585;
        --red-soft: #432929;
        --shadow: 0 12px 36px #0008;
      }
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text); background: var(--canvas); }
    button, input, select { font: inherit; color: inherit; }
    button, select { min-height: 32px; }
    button {
      border: 1px solid var(--line); border-radius: 7px; padding: 6px 11px;
      background: var(--surface); cursor: pointer; white-space: nowrap;
    }
    button:hover { border-color: var(--accent); }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 1px;
    }
    button:disabled { opacity: .55; cursor: not-allowed; }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.danger { background: var(--red); border-color: var(--red); color: white; }
    button.quiet { border-color: transparent; background: transparent; color: var(--secondary); }
    input, select { min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; background: var(--surface); }
    input[readonly] { color: var(--secondary); }
    code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; overflow-wrap: anywhere; }
    .app { display: grid; grid-template-columns: 224px minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) 176px; min-height: 620px; height: 100vh; }
    aside { grid-row: 1 / 3; padding: 18px 12px; background: var(--sidebar); border-right: 1px solid var(--line); }
    .brand { display: flex; gap: 10px; align-items: center; padding: 2px 8px 22px; font-weight: 700; }
    .brand-icon { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 8px; background: var(--accent); color: #fff; font-size: 16px; }
    .nav-label { margin: 15px 9px 5px; color: var(--tertiary); font-size: 11px; font-weight: 650; }
    .nav-item { display: flex; align-items: center; gap: 9px; width: 100%; margin: 2px 0; border-color: transparent; background: transparent; text-align: left; }
    .nav-item.active { color: var(--accent); background: var(--accent-soft); border-color: transparent; font-weight: 650; }
    .nav-icon { width: 17px; text-align: center; }
    main { min-width: 0; overflow: auto; }
    .topbar { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 22px; background: color-mix(in srgb, var(--canvas) 92%, transparent); border-bottom: 1px solid var(--line); backdrop-filter: blur(14px); }
    .crumb { color: var(--secondary); }
    .demo-controls { display: flex; align-items: center; gap: 8px; color: var(--secondary); font-size: 12px; }
    .demo-controls select { min-height: 29px; padding: 4px 8px; }
    .prototype-label { color: var(--tertiary); font-size: 11px; }
    .page { width: min(1100px, 100%); margin: 0 auto; padding: 22px; }
    .page-heading { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px; }
    .page-icon { color: var(--accent); font-size: 22px; line-height: 1.25; }
    h1 { margin: 0; font-size: 21px; letter-spacing: -.2px; }
    h2 { margin: 0; font-size: 14px; }
    h3 { margin: 0; font-size: 13px; }
    p { margin: 4px 0 0; color: var(--secondary); }
    .panel { margin-bottom: 14px; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 13px 15px; border-bottom: 1px solid var(--line); }
    .panel-head p { font-size: 12px; }
    .panel-body { padding: 14px 15px; }
    .toolbar, .row, .actions, .inline-field { display: flex; align-items: center; gap: 8px; }
    .toolbar { flex-wrap: wrap; }
    .toolbar .path-input { flex: 1 1 280px; }
    .path-input { width: 100%; }
    .field { display: grid; gap: 5px; min-width: 0; }
    .field label { color: var(--secondary); font-size: 12px; }
    .grid-two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .summary { display: flex; flex-wrap: wrap; align-items: center; gap: 7px 14px; color: var(--secondary); font-size: 12px; }
    .chip, .status { display: inline-flex; align-items: center; gap: 5px; width: fit-content; padding: 3px 8px; border-radius: 999px; background: var(--surface-muted); color: var(--secondary); font-size: 11px; }
    .status.success { color: var(--green); background: var(--green-soft); }
    .status.warning { color: var(--orange); background: var(--orange-soft); }
    .status.failure { color: var(--red); background: var(--red-soft); }
    .list { display: grid; gap: 8px; }
    .repo-row { padding: 11px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .repo-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .repo-name { font-weight: 650; }
    .repo-path { margin-top: 5px; color: var(--tertiary); font-size: 11px; }
    .target-line { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 7px; font-size: 12px; }
    .target-line .arrow { color: var(--tertiary); }
    .empty { display: grid; justify-items: center; gap: 5px; min-height: 140px; padding: 24px; color: var(--secondary); text-align: center; }
    .empty-icon { color: var(--tertiary); font-size: 23px; }
    .empty strong { color: var(--text); font-size: 13px; }
    .callout { margin-top: 12px; padding: 10px 12px; border-radius: 7px; background: var(--orange-soft); color: var(--orange); }
    .callout.success { background: var(--green-soft); color: var(--green); }
    .callout.warning { background: var(--orange-soft); color: var(--orange); }
    .callout.failure { background: var(--red-soft); color: var(--red); }
    .error-box { margin-top: 12px; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--red) 45%, var(--line)); border-radius: 7px; background: var(--red-soft); color: var(--red); }
    .progress { display: flex; align-items: center; gap: 8px; padding: 10px 0; color: var(--accent); }
    .spinner { width: 14px; height: 14px; border: 2px solid color-mix(in srgb, var(--accent) 30%, transparent); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .copy-pair { padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
    .copy-pair + .copy-pair { margin-top: 9px; }
    .copy-pair-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 9px; }
    .deprecated { display: inline-flex; align-items: center; margin-left: auto; padding: 2px 6px; border: 1px solid var(--line); border-radius: 999px; color: var(--secondary); font-size: 10px; }
    .tag-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--line); border-radius: 8px; }
    .tag-row + .tag-row { margin-top: 8px; }
    .tag-workspace { display: grid; grid-template-columns: 235px minmax(0, 1fr); align-items: start; gap: 14px; }
    .tag-workspace .panel { margin-bottom: 0; }
    .tag-repo-list { display: grid; gap: 5px; }
    .tag-repo-group + .tag-repo-group { margin-top: 15px; }
    .tag-repo-group-title { margin: 0 0 6px; padding: 0 4px; color: var(--tertiary); font-size: 11px; font-weight: 650; }
    .tag-repo-option { display: flex; align-items: center; justify-content: space-between; gap: 8px; width: 100%; min-height: 42px; padding: 8px 9px; border-color: transparent; background: transparent; text-align: left; }
    .tag-repo-option.active { color: var(--accent); background: var(--accent-soft); }
    .tag-repo-option-name { min-width: 0; overflow-wrap: anywhere; font-weight: 600; }
    .tag-repo-option .chip { flex: 0 0 auto; }
    .tag-workspace-main { display: grid; gap: 12px; min-width: 0; }
    .tag-choice { display: flex; align-items: flex-start; gap: 10px; min-width: 0; cursor: pointer; }
    .tag-choice input { margin: 2px 0 0; accent-color: var(--accent); }
    .tag-choice-content { min-width: 0; }
    .tag-row.selected { border-color: var(--accent); background: var(--accent-soft); }
    .tag-presence { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
    .tag-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .separator { margin: 15px 0; border-top: 1px solid var(--line); }
    .footer-actions { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 14px; }
    .hint { color: var(--secondary); font-size: 11px; }
    .log-panel { min-width: 0; display: flex; flex-direction: column; background: var(--surface); border-top: 1px solid var(--line); }
    .log-head { display: flex; align-items: center; gap: 9px; padding: 8px 13px; }
    .log-head strong { font-size: 12px; }
    .log-filters { display: flex; align-items: center; gap: 4px; margin-left: 12px; }
    .log-filter { min-height: 25px; padding: 2px 7px; font-size: 10px; }
    .log-filter.active { color: var(--accent); background: var(--accent-soft); }
    .log-list { overflow: auto; padding: 0 14px 10px; font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .log-entry { display: grid; grid-template-columns: 65px 55px minmax(0, 1fr); gap: 8px; color: var(--secondary); }
    .log-entry .level { font-weight: 700; }
    .log-entry.success .level { color: var(--green); }
    .log-entry.warning .level { color: var(--orange); }
    .log-entry.error .level { color: var(--red); }
    dialog { width: min(470px, calc(100vw - 28px)); padding: 0; color: var(--text); border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); }
    dialog::backdrop { background: #0006; backdrop-filter: blur(2px); }
    .dialog-content { padding: 18px; }
    .dialog-content h2 { font-size: 16px; }
    .dialog-content p { margin-top: 8px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
    .toast { position: fixed; right: 20px; bottom: 190px; z-index: 5; max-width: min(420px, calc(100vw - 32px)); padding: 9px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); box-shadow: var(--shadow); opacity: 0; pointer-events: none; transform: translateY(8px); transition: .18s ease; }
    .toast.show { opacity: 1; transform: translateY(0); }
    @media (max-width: 760px) {
      .app { grid-template-columns: 62px minmax(0, 1fr); }
      aside { padding: 12px 6px; }
      .brand { justify-content: center; padding: 2px 0 17px; }
      .brand-name, .nav-label, .nav-text { display: none; }
      .deprecated { display: none; }
      .nav-item { justify-content: center; padding: 8px 4px; }
      .nav-icon { width: auto; }
      .topbar { align-items: flex-start; flex-direction: column; padding: 10px 14px; }
      .page { padding: 16px 12px; }
      .grid-two { grid-template-columns: 1fr; }
      .tag-workspace { grid-template-columns: 1fr; }
      .tag-row { grid-template-columns: minmax(0, 1fr); }
      .tag-actions { justify-content: flex-start; }
      .log-filters { overflow: auto; margin-left: 0; }
      .log-head { flex-wrap: wrap; }
      .app { grid-template-rows: minmax(0, 1fr) 190px; }
      .prototype-label { display: none; }
    }
    @media (max-width: 480px) {
      .actions, .toolbar { align-items: stretch; flex-direction: column; }
      .actions button, .toolbar button { width: 100%; }
      .footer-actions { align-items: stretch; flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside aria-label="工具导航">
      <div class="brand"><span class="brand-icon" aria-hidden="true">J</span><span class="brand-name">JYBToolApp</span></div>
      <div class="nav-label">公版</div>
      <button class="nav-item" data-page="public"><span class="nav-icon" aria-hidden="true">⑂</span><span class="nav-text">分支切换</span></button>
      <button class="nav-item" data-page="pull"><span class="nav-icon" aria-hidden="true">↓</span><span class="nav-text">仓库更新</span></button>
      <button class="nav-item" data-page="tags"><span class="nav-icon" aria-hidden="true">#</span><span class="nav-text">Tag 管理</span></button>
      <button class="nav-item" data-page="submodules"><span class="nav-icon" aria-hidden="true">⑂</span><span class="nav-text">分支切换（已过时）</span></button>
      <div class="nav-label">私版</div>
      <button class="nav-item" data-page="broker"><span class="nav-icon" aria-hidden="true">⇄</span><span class="nav-text">券商仓库切换</span></button>
      <button class="nav-item" data-page="copy"><span class="nav-icon" aria-hidden="true">▢</span><span class="nav-text">私版项目复制</span></button>
    </aside>
    <main>
      <header class="topbar">
        <div class="crumb"><span id="crumb-group">公版</span>　/　<strong id="crumb-page">分支切换</strong></div>
        <div class="demo-controls"><label for="outcome-mode">演示结果</label><select id="outcome-mode"><option value="success">全部成功</option><option value="partial">部分失败</option><option value="failure">全部失败</option></select><span class="prototype-label">HTML 原型 · 操作均为模拟</span></div>
      </header>
      <div class="page" id="page" tabindex="-1"></div>
    </main>
    <section class="log-panel" aria-label="统一日志">
      <div class="log-head"><strong>执行日志 <span id="log-count">0</span></strong><div class="log-filters" id="log-filters"></div><button class="quiet" id="log-clear">清空日志</button></div>
      <div class="log-list" id="log-list" aria-live="polite"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-content" id="dialog-content"></div></dialog>
  <script>
    const demoRepos = [
      { name: "TradeBook_App", current: "develop", target: "develop", kind: "分支", path: "./TradeBook_App", cloned: true },
      { name: "TradeBook_Private", current: "develop", target: "v8.4.18", kind: "Tag", path: "./TradeBook_Private", cloned: true },
      { name: "TradeBook_Public", current: "develop", target: "v8.4.20", kind: "Tag", path: "./TradeBook_Public", cloned: true },
      { name: "Flutter_Module", current: "develop", target: "develop", kind: "分支", path: "./Flutter_Module", cloned: true },
      { name: "Trade_UI", current: "public_release", target: "public_release", kind: "分支", path: "./Trade_UI", cloned: true },
      { name: "Trade_ModuleTrade", current: "JYB_1.5.1", target: "JYB_1.5.2", kind: "分支", path: "./Trade_ModuleTrade", cloned: false }
    ];
    const brokerRepos = [
      { name: "TradeBook_Main", current: "develop", target: "dev", kind: "分支", path: "../TradeBook_Main/repos", cloned: true },
      { name: "TradeBook_Trade", current: "dev", target: "dev", kind: "分支", path: "../TradeBook_Trade", cloned: true },
      { name: "TradeBook_Quote", current: "release/8.4", target: "dev", kind: "分支", path: "../TradeBook_Quote", cloned: true },
      { name: "TradeBook_Base", current: "dev", target: "dev", kind: "分支", path: "../TradeBook_Base", cloned: true },
      { name: "TradeBook_UI", current: "feature/layout", target: "dev", kind: "分支", path: "../TradeBook_UI", cloned: true }
    ];
    const demoSubmodules = [
      { name: "Trade_Comm", current: "develop", target: "public_release" },
      { name: "Trade_UI", current: "release/8.4", target: "develop" },
      { name: "Trade_Base", current: "develop", target: "public_release" },
      { name: "Trade_Public", current: "develop", target: "develop" }
    ];
    const updateRepos = [
      { name: "TradeBook_App", current: "develop", path: "/workspace/TradeBook_App", cloned: true },
      ...demoRepos.map(repo => ({ name: repo.name, current: repo.current, path: `/workspace/${repo.name}`, cloned: repo.cloned }))
    ];
    const names = { broker: "私版券商切换", submodules: "分支切换（已过时）", public: "分支切换", pull: "仓库更新", tags: "Tag 管理", copy: "私版项目复制" };
    const state = {
      page: "public", mode: "success", loaded: { broker: false, submodules: false, public: false, pull: false, tags: false },
      busy: false, logs: [], activeLevels: new Set(["info", "success", "warning", "error"]),
      outcomes: {}, errors: {}, copyPairs: 1, copyResult: null, selectedTagRepo: demoRepos[0].name, selectedTagName: null, selectedPullRepos: new Set(), activeTagByRepo: {},
      demoTagsByRepo: {
        [demoRepos[0].name]: [
          { name: "v8.4.20", local: true, remote: true, object: "a1b2c3d" },
          { name: "v8.4.19", local: true, remote: false, object: "e4f5a6b" },
          { name: "releases/v8.4.18", local: false, remote: true, object: "c7d8e9f" }
        ]
      }
    };
    const escapeHTML = value => String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[char]));
    const pageRoot = document.getElementById("page");
    const dialog = document.getElementById("dialog");
    const statusClass = status => status === "成功" ? "success" : status === "失败" ? "failure" : status === "跳过" ? "warning" : "";
    const now = () => new Date().toLocaleTimeString("zh-CN", { hour12: false });

    function addLog(level, message) {
      state.logs.unshift({ time: now(), level, message });
      renderLogs();
    }
    function renderLogs() {
      const list = document.getElementById("log-list");
      const visible = state.logs.filter(entry => state.activeLevels.has(entry.level));
      document.getElementById("log-count").textContent = state.logs.length;
      list.innerHTML = visible.length ? visible.map(entry => `<div class="log-entry ${entry.level}"><span>${escapeHTML(entry.time)}</span><span class="level">${escapeHTML(entry.level.toUpperCase())}</span><span>${escapeHTML(entry.message)}</span></div>`).join("") : '<div class="hint">当前筛选下没有日志</div>';
      document.getElementById("log-filters").innerHTML = ["info", "success", "warning", "error"].map(level => `<button class="log-filter ${state.activeLevels.has(level) ? "active" : ""}" data-log-filter="${level}" aria-pressed="${state.activeLevels.has(level)}">${level.toUpperCase()}</button>`).join("");
    }
    function heading(group, page, icon, description) {
      document.getElementById("crumb-group").textContent = group;
      document.getElementById("crumb-page").textContent = page;
      return `<div class="page-heading"><div class="page-icon" aria-hidden="true">${icon}</div><div><h1>${page}</h1><p>${description}</p></div></div>`;
    }
    function empty(title, detail, icon = "▱") {
      return `<div class="empty"><span class="empty-icon" aria-hidden="true">${icon}</span><strong>${title}</strong><span>${detail}</span></div>`;
    }
    function progress(label) { return `<div class="progress" role="status"><span class="spinner" aria-hidden="true"></span>${label}</div>`; }
    function repoRows(repos, resultMap = {}) {
      resultMap ||= {};
      return `<div class="list">${repos.map(repo => {
        const status = resultMap[repo.name] || (repo.cloned === false ? "待克隆" : "待执行");
        const klass = statusClass(status);
        return `<article class="repo-row"><div class="repo-top"><span class="repo-name">${escapeHTML(repo.name)}</span><span class="status ${klass}">${escapeHTML(status)}</span></div><div class="target-line"><span class="mono">${escapeHTML(repo.current || "未检出")}</span><span class="arrow" aria-hidden="true">→</span><b class="mono">${escapeHTML(repo.target)}</b><span class="chip">${escapeHTML(repo.kind || "分支")}</span></div><div class="repo-path mono">${escapeHTML(repo.path || "仓库路径待解析")}</div></article>`;
      }).join("")}</div>`;
    }
    function renderBroker() {
      const loaded = state.loaded.broker;
      pageRoot.innerHTML = heading("私版", names.broker, "⇄", "按 repos.yaml 逐仓查看目标分支，确认后批量切换。") +
        `<section class="panel"><div class="panel-head"><div><h2>配置仓库</h2><p>选择包含 repos.yaml 的私版配置目录</p></div></div><div class="panel-body"><div class="toolbar"><input class="path-input mono" id="broker-path" readonly value="${loaded ? "/workspace/TradeBook_Private_Config" : ""}" placeholder="选择配置仓库目录" aria-label="配置仓库路径"><button data-action="choose-broker">选择演示目录</button><select id="broker-branch" aria-label="选择目标分支"><option>dev</option><option>develop</option><option>release/8.4</option></select><button class="primary" data-action="load-broker">读取仓库状态</button></div>${state.busy && state.page === "broker" ? progress("正在读取仓库和分支状态…") : ""}${state.errors.broker ? `<div class="error-box" role="alert">${escapeHTML(state.errors.broker)}</div>` : ""}</div></section>` +

        }
        const branch = document.getElementById(selectId)?.value || "develop";
        addLog("success", key === "pull" ? `${label}读取完成，共 ${updateRepos.length} 个仓库` : `${label}读取完成：目标分支 ${branch}`);
        renderPage();
      }, 650);
    }
    function pickDemoPath(inputId, path) {
      const input = document.getElementById(inputId);
      if (input) input.value = path;
      addLog("info", `选择演示目录：${path}`);
    }
    function runCopy() {
      if (state.busy) return;
      const oldPrefix = document.getElementById("old-prefix")?.value.trim() || "";
      const newPrefix = document.getElementById("new-prefix")?.value.trim() || "";
      if (!oldPrefix || !newPrefix || oldPrefix === newPrefix) {
        showToast("请填写不同的旧前缀和新前缀");
        return;
      }
      state.busy = true;
      state.copyResult = { status: "running", done: 0, failed: 0, message: "按步骤复制、替换并验证项目" };
      renderPage();
      addLog("info", `项目复制开始：${state.copyPairs} 组，${oldPrefix} → ${newPrefix}（模拟）`);
      window.setTimeout(() => {
        const failed = state.mode === "failure" ? state.copyPairs : state.mode === "partial" ? 1 : 0;
        const done = state.copyPairs - failed;
        state.copyResult = { status: failed ? "失败" : "成功", done, failed, message: failed ? "部分目标目录模拟失败。成功项保留，可从日志查看原因。" : "路径校验、复制和前缀替换步骤均已模拟完成。" };
        state.busy = false;
        addLog(failed ? "error" : "success", `项目复制结果：成功 ${done}，失败 ${failed}`);
        renderPage();
        showToast(failed ? "项目复制出现失败项" : "项目复制演示完成");
      }, 1100);
    }
    document.addEventListener("click", event => {
      const nav = event.target.closest("[data-page]");
      if (nav) { state.page = nav.dataset.page; renderPage(); return; }
      const filter = event.target.closest("[data-log-filter]");
      if (filter) {
        const level = filter.dataset.logFilter;
        state.activeLevels.has(level) ? state.activeLevels.delete(level) : state.activeLevels.add(level);
        renderLogs(); return;
      }
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;
      if (action === "choose-broker") pickDemoPath("broker-path", "/workspace/TradeBook_Private_Config");
      if (action === "choose-submodules") pickDemoPath("submodule-path", "/workspace/TradeBook_Main");
      if (action === "choose-public") pickDemoPath("public-path", "/workspace/TradeBook_App");
      if (action === "choose-pull") pickDemoPath("pull-path", "/workspace/TradeBook_App");
      if (action === "load-broker") loadConfig("broker", "broker-path", "broker-branch", "私版仓库配置");
      if (action === "load-submodules") loadConfig("submodules", "submodule-path", "submodule-branch", "主仓库子模块配置");
      if (action === "load-public") loadConfig("public", "public-path", "public-branch", "fastlane/repos.yml");
      if (action === "load-pull") loadConfig("pull", "pull-path", "pull-path", "公版仓库更新范围");
      if (action === "switch-broker") confirmAction("确认切换私版仓库？", `将按 repos.yaml 更新 ${brokerRepos.length} 个仓库的分支。请确认已保存需要保留的本地修改。`, "确认切换", () => simulateBatch("broker", brokerRepos, "私版仓库切换"));
      if (action === "switch-submodules") confirmAction("确认切换主仓库与子模块？", `将切换主仓库并更新 ${demoSubmodules.length} 个子模块。`, "确认切换", () => simulateBatch("submodules", demoSubmodules, "子模块切换"));
      if (action === "switch-public") confirmAction("确认切换公版仓库分支？", `将按 repos.yml 切换 ${demoRepos.length} 个仓库的分支；tag 字段不会作为切换目标。`, "确认切换", () => simulateBatch("public", demoRepos, "公版仓库分支切换"));
      if (action === "pull-toggle-all") {
        if (state.selectedPullRepos.size === updateRepos.length) state.selectedPullRepos.clear();
        else state.selectedPullRepos = new Set(updateRepos.map(repo => repo.path));
        renderPage();
      }
      if (action === "pull-latest") {
        const selected = updateRepos.filter(repo => state.selectedPullRepos.has(repo.path));
        confirmAction("确认更新所选仓库？", `将更新 ${selected.length} 个仓库的当前分支；未选择的仓库保持不变。`, "开始更新", () => simulateBatch("pull", selected, "公版仓库更新"), false);
      }
      if (action === "select-tag-repo") {
        state.selectedTagRepo = button.dataset.repo;
        state.selectedTagName = null;
        state.loaded.tags = false;
        state.errors.tags = null;
        renderPage();
      }
      if (action === "load-tags") {
        if (state.busy) return;
        state.loaded.tags = false;
        state.errors.tags = null;
        state.busy = true;
        renderPage();
        addLog("info", `正在读取 ${state.selectedTagRepo} 的本地和远端 Tag…`);
        window.setTimeout(() => {
          state.busy = false;
          if (state.mode === "failure") {
            state.errors.tags = "Tag 列表读取失败：演示仓库或 origin 不可用。";
            addLog("error", state.errors.tags);
            showToast("Tag 列表读取失败");
          } else {
            state.loaded.tags = true;
            addLog("success", `${state.selectedTagRepo} · 读取到 ${(state.demoTagsByRepo[state.selectedTagRepo] || []).length} 个 Tag`);
          }
          renderPage();
        }, 650);
      }
      if (action === "create-tag") {
        const tagName = document.getElementById("new-tag-name")?.value.trim() || "";
        const message = document.getElementById("new-tag-message")?.value.trim() || "";
        if (!state.loaded.tags) { showToast("请先读取目标仓库的 Tag"); return; }
        if (!tagName || !message || /\s/.test(tagName) || tagName.includes("..") || tagName.startsWith("/") || tagName.endsWith("/")) { showToast("请填写有效的 Tag 名称和附注"); return; }
        if ((state.demoTagsByRepo[state.selectedTagRepo] || []).some(tag => tag.name === tagName)) { showToast("该 Tag 已存在"); return; }
        confirmAction("确认创建 annotated Tag？", `将在 ${state.selectedTagRepo} 创建本地 Tag ${tagName}。附注：${message}`, "创建 Tag", () => runTagAction("创建本地", tagName, message), false);
      }
      if (action === "push-tag") {
        const tagName = button.dataset.tag;
        confirmAction("确认推送 Tag？", `将把 ${state.selectedTagRepo} 的本地 Tag ${tagName} 推送到 origin。`, "推送 Tag", () => runTagAction("推送", tagName), false);
      }
      if (action === "checkout-tag") {
        const tagName = state.selectedTagName;
        if (!tagName) { showToast("请先选择一个 Tag"); return; }
        confirmAction("确认切换到 Tag？", `将把 ${state.selectedTagRepo} 切换到 Tag ${tagName} 指向的提交（detached HEAD）。`, "切换到此 Tag", () => runTagAction("切换到", tagName), false);
      }
      if (action === "delete-local-tag" || action === "delete-remote-tag") {
        const tagName = button.dataset.tag;
        const remote = action === "delete-remote-tag";
        const scope = remote ? "origin 上的远端" : "本地";
        confirmAction(`确认删除${scope} Tag？`, `将从 ${state.selectedTagRepo} 删除${scope} Tag ${tagName}。此操作不可通过本页撤销。`, "删除 Tag", () => runTagAction(remote ? "删除远端" : "删除本地", tagName));
      }
      if (action === "add-pair") { state.copyPairs += 1; renderPage(); }
      if (action === "remove-pair") { if (state.copyPairs > 1) state.copyPairs -= 1; renderPage(); }
      if (action === "browse-source" || action === "browse-target") {
        const index = Number(button.dataset.index);
        const input = document.getElementById(`${action === "browse-source" ? "source" : "target"}-${index}`);
        if (input) input.value = `/workspace/Example_${action === "browse-source" ? "Source" : "Copy"}_${index + 1}`;
        addLog("info", "已选择演示路径；没有访问本地文件系统");
      }
      if (action === "preview-copy") {
        const oldPrefix = document.getElementById("old-prefix")?.value.trim() || "旧前缀";
        const newPrefix = document.getElementById("new-prefix")?.value.trim() || "新前缀";
        const paths = Array.from({ length: state.copyPairs }, (_, index) => ({
          source: document.getElementById(`source-${index}`)?.value.trim() || "",
          target: document.getElementById(`target-${index}`)?.value.trim() || ""
        }));
        if (paths.some(pair => !pair.source || !pair.target)) { showToast("请补全每组源目录和目标目录"); return; }
        if (!oldPrefix || !newPrefix || oldPrefix === newPrefix) { showToast("请填写不同的旧前缀和新前缀"); return; }
        const pathSummary = paths.map((pair, index) => `路径对 ${index + 1}：${pair.source} → ${pair.target}`).join("；");
        confirmAction("确认复制并替换项目？", `${pathSummary}。将把“${oldPrefix}”替换为“${newPrefix}”。目标目录内的同名文件可能被覆盖；此原型不会写入文件。`, "开始模拟复制", runCopy);
      }
    });
    document.getElementById("outcome-mode").addEventListener("change", event => {
      state.mode = event.target.value;
      addLog("info", `演示结果模式：${event.target.selectedOptions[0].textContent}`);
    });
    document.addEventListener("change", event => {
      if (event.target.matches("[data-pull-repo]")) {
        const path = event.target.dataset.pullRepo;
        event.target.checked ? state.selectedPullRepos.add(path) : state.selectedPullRepos.delete(path);
        renderPage();
      }
      if (event.target.matches("[data-tag-choice]")) {
        state.selectedTagName = event.target.value;
        renderPage();
      }
    });
    document.getElementById("log-clear").addEventListener("click", () => { state.logs = []; renderLogs(); showToast("日志已清空（演示）"); });
    renderLogs();
    renderPage();
  </script>
</body>
</html>
